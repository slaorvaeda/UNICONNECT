<svg width="350" height="390" viewBox="0 0 350 390" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
    /* Swaying head animation */
    @keyframes sway {
        0%, 100% {
            transform: rotate(0deg);
        }
        50% {
            transform: rotate(1.2deg) translateY(-0.5px);
        }
    }
    /* Hair waving animation */
    @keyframes hair-wave {
        0%, 100% {
            transform: skewX(0deg) scaleX(1);
        }
        50% {
            transform: skewX(1deg) scaleX(1.01);
        }
    }
    /* Blinking eyes animation */
    @keyframes blink {
        0%, 90%, 94%, 100% {
            transform: scaleY(1);
        }
        92% {
            transform: scaleY(0.1);
        }
    }
    /* Micro eyebrow movement on blink */
    @keyframes eyebrow-move {
        0%, 90%, 94%, 100% {
            transform: translateY(0px);
        }
        92% {
            transform: translateY(1.2px);
        }
    }

    .sari-head {
        animation: sway 5s ease-in-out infinite;
        transform-origin: 175px 235px;
    }
    .sari-hair-back {
        animation: hair-wave 6s ease-in-out infinite;
        transform-origin: 175px 80px;
    }
    .sari-eye-left {
        animation: blink 4s ease-in-out infinite;
        transform-origin: 140px 172px;
    }
    .sari-eye-right {
        animation: blink 4s ease-in-out infinite;
        transform-origin: 212px 172px;
    }
    .sari-eyebrow-left {
        animation: eyebrow-move 4s ease-in-out infinite;
        transform-origin: 113px 166px;
    }
    .sari-eyebrow-right {
        animation: eyebrow-move 4s ease-in-out infinite;
        transform-origin: 235px 163px;
    }
</style>

